    <!-- Base path handler to support deep routing (/project/...) -->
    <script>
      (function() {
        var base = document.createElement('base');
        if (window.location.protocol === 'file:') {
          base.href = window.location.href.split('#')[0].split('?')[0].replace(/\/project\/.*$/, '/').replace(/\/[^\/]*$/, '/');
        } else {
          var p = window.location.pathname.replace(/\/project(\/.*)?$/, '');
          p = p.replace(/\/[^\/]*\.[a-zA-Z0-9]+$/, '/');
          if (!p.endsWith('/')) p += '/';
          base.href = window.location.origin + p;
        }
        document.head.appendChild(base);
      })();
    </script>
